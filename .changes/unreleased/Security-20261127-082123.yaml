kind: Security
body: 'sandbox: on macOS, a run behind the block no longer dies, now and then, before the system sandbox sets the profile. The dry run''s exit sends the caller SIGCHLD, and the exec of `sandbox-exec` followed the dry run''s wait at once. A SIGCHLD still pending at the exec ended the new image at its first instruction with SIGILL, so the caller died in place of the program, in 12 of 30,000 starts under a load of four busy goroutines. It failed closed: nothing ran and no descriptor reached a program. The exec now waits until the runtime has taken a SIGCHLD sent since the dry run began. A dry run whose exit no SIGCHLD says within the dry run''s bound refuses the run, matching `ErrNoBlock`, before the exec. The same 30,000 starts now all run. A SIGCHLD from another child of the caller, one that exits while the dry run runs or at the exec, is not held off.'
