kind: Security
body: 'sandbox: on Linux, under glibc, the load search now passes over a folder in a list that glibc cannot walk, a link loop, a folder past the kernel''s length limit or a file, and takes the next folder''s library, as glibc does, where v0.19.1 refused the program. In a folder that is there, a path that the kernel answers with an error other than not found or permission denied is still refused, and so now is not a folder, a library name that is a link through a file: glibc up to 2.38 ends the folder list there, and 2.39 goes on, so for 2.39 the refusal fails closed. Under musl nothing changes: such a folder is still refused. Under glibc 2.36 or older, a folder the search looks in is now refused when its `tls`, platform or hwcap subfolder, which glibc up to 2.36 looks in first, has a real path beneath no built-in folder of the loader, is a link loop, or has a real path that cannot be told; a built-in folder''s own still passes. The release is read from the loader''s file, from the line its `--version` prints. Where the file names none, as before glibc 2.33, or names two that differ, the subfolder alone refuses the folder, and the error says so. Of v0.19.1''s list of loads not promised refused up front, the legacy subfolders leave it. What the block enforces does not change. Breaking: a program under glibc 2.36 or older, or under a glibc whose release cannot be told, whose folder held has such a subfolder is now refused.'
