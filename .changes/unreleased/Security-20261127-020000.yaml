kind: Security
body: 'sandbox: on Linux, `RunHolding` and `Check` with folders refuse with `ErrUsage`, before anything is set, a library whose real file lies in a folder beneath neither a folder the caller named nor a built-in folder of the program''s loader, naming the file and its folder. Before, a library the program, or a library it loads, named by its full path or found by its run path added its real folder, and all beneath it, to what the program could read and run, so a program written into a read-write folder could read a folder the caller never named. Each library is judged by its own needs and run path, and a link by the file it leads to. Breaking: a program that ran only because such a library''s folder was added now needs that folder, or one above it, named in `Folders`.'
