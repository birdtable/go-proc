kind: Security
body: 'sandbox: on Linux, under glibc 2.37 or older, or a glibc whose release cannot be told from its loader''s file, the load search now asks whether a folder in a list is there without its closing slash, as glibc up to 2.37 does, and with it from 2.38. So a folder whose written path is 4,095 bytes, at the kernel''s length limit, where the library''s path is past it, is now refused under those, as glibc up to 2.37 ends the list there, where v0.19.2 passed it over; from 2.38 it is still passed over, as glibc passes it over. The root in a list is still asked as itself, though glibc up to 2.37 passes it over, which fails closed. On arm64, under glibc 2.36 or older, or a glibc whose release cannot be told, a folder the search looks in is now refused when a subfolder named for any hwcap bit glibc knows, `asimd`, `aes`, `sve` and the rest, has a real path beneath no built-in folder of the loader, not only one of the default mask''s: the caller widens the mask in the program''s environment by `LD_HWCAP_MASK`, or by `GLIBC_TUNABLES` with `glibc.tune.hwcap_mask` from 2.26 to 2.28 or `glibc.cpu.hwcap_mask` from 2.29, and `sandbox.Check` is given no environment, so every name is judged whatever the mask. `cpuid`, the default mask''s name before `atomics`, is among them. Of v0.19.2''s list of loads not promised refused up front, a hwcap subfolder read under a widened mask leaves it. What the block enforces does not change. Breaking: such a program is now refused.'
