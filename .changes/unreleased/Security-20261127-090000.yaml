kind: Security
body: 'sandbox: on Linux, `RunHolding` and `Check` with folders refuse with `ErrUsage`, before anything is set, three more ways a loader reaches a library the load search never judged: a program or library naming a library by `DT_AUDIT`, `DT_DEPAUDIT`, `DT_FILTER` or `DT_AUXILIARY`; under glibc, a searched folder whose `glibc-hwcaps` subfolder lies beneath no built-in folder of the loader; and a path the kernel answers with an error other than not found, denied or not a folder, such as a link loop or a path too long, ahead of a library in the next folder. Under musl the search names a found library as musl does, keeping a folder''s closing slash, so `$ORIGIN` and the 512-byte limit read the name musl reads. Breaking: such a program now needs its libraries reached by the search order alone.'
time: 2026-11-27T09:00:00.000000+00:00
