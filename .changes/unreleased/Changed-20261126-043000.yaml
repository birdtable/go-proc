kind: Changed
body: 'sandbox: `RunHolding`, and `Check` with folders, hold the program to the folders as a file like any other, and refuse with `ErrUsage`, before anything is set, a program they do not hold, naming the folder it would need. They walk its path, following each symbolic link as the kernel does, up to 40 links on Linux and 32 on macOS. Its real file, where the path ends, must be beneath a folder held, the load folders `RunHolding` adds included; on macOS each link on the path must be too, since the system sandbox refuses to follow a link outside its folders. Nothing is ever added to the folders. A dangling or empty link, a name after a file, and a path past the link limit are `ErrUsage` too. On Linux, where Landlock already held the real file, a program whose real folder was not held, such as `/usr/bin/false` on Ubuntu 26.04, which links to `/usr/lib/cargo/bin/coreutils/false`, is now refused up front where before the block was set and the exec failed with permission denied. Breaking on macOS, where the system sandbox does not hold a program''s exec: a program whose folder the caller never named, or one reached through a link in a folder that is not held (`/tmp`, `/var` and `/etc` are such links), ran before and is now `ErrUsage`. Name the program''s real folder in `Folders`, and the program by its real path. On macOS this hold is `RunHolding`''s own check, as of the walk; SECURITY.md says so.'
