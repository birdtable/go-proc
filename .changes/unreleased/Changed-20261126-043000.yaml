kind: Changed
body: 'sandbox: `RunHolding`, and `Check` with folders, hold the program to the folders as a file like any other, and refuse with `ErrUsage`, before anything is set, a program they do not hold, naming the folder it would need. They walk its path, following each symbolic link as the kernel does, up to 40 links on Linux and 32 on macOS. Its real file, where the path ends, must be beneath a folder the caller named or its loader''s own folder; on macOS each link on the path must be too, since the system sandbox refuses to follow a link outside its folders, and so must a `#!` script''s interpreter, read from the script''s first line with no lookup. The other load folders `RunHolding` adds come from the program''s own bytes, its run path and the libraries it names, and never count toward holding it. Nothing is ever added to the folders. A dangling or empty link, a name after a file, and a path past the link limit are `ErrUsage` too. On macOS the profile now denies every exec but of a file beneath the folders, as Landlock does on Linux. On Linux, where Landlock already held the real file, a program whose real folder was not held, such as `/usr/bin/false` on Ubuntu 26.04, which links to `/usr/lib/cargo/bin/coreutils/false`, is now refused up front where before the block was set and the exec failed with permission denied. Breaking on Linux: a program in a folder the caller never named whose run path has `$ORIGIN`, or that names a library beside it by its full path, had that folder added and ran, and is now `ErrUsage`. Breaking on macOS, where the system sandbox did not hold a program''s exec: a program whose folder the caller never named, one reached through a link in a folder that is not held (`/tmp`, `/var` and `/etc` are such links), a `#!` script whose interpreter is outside the folders, a file that may run with no `#!` and no Mach-O program''s format, a Mach-O library or object among them, and a `#!` script whose interpreter is no Mach-O program, a script itself among them, each of which the kernel refuses with ENOEXEC and execvp runs with `/bin/sh`, while `/bin` is not held, ran before and are now `ErrUsage`; a program whose real file the caller may not run, as `access(2)` with `X_OK` asks the kernel, a file of mode 0601 that the caller owns among them, which the kernel refuses to run, is `ErrUsage` too, where before it failed after the exec with the system sandbox''s exit 71; and a program behind the block can no longer start programs outside the folders, a shell''s `/bin/sh` among them. Name the program''s real folder in `Folders`, the program by its real path, and the folder of each program it starts.'
