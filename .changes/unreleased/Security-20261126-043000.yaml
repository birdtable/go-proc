kind: Security
body: 'gitenv: `api/contract.txt` now promises on Windows too, and on all three systems, what it promised on Linux and macOS alone: a hook folder or file system monitor that the caller''s environment names through `GIT_CONFIG_COUNT` and its pairs runs no program in a git started with `Env`''s result, and `GIT_DIR`, `GIT_WORK_TREE`, `GIT_INDEX_FILE`, `GIT_CONFIG`, `GIT_CONFIG_PARAMETERS` and `GIT_CONFIG_COUNT` in the caller''s environment change nothing that git reads or writes. `TestAProgramTheEnvironmentNamesRunsUnlessEnvDropsItsVariables` and `TestEachVariableThatMovesGitChangesNothingUnderEnv` now run Git for Windows under `Env`, from the test process''s own environment, where the hook and the monitor run under the environment as it is and each variable moves git when it is given as it is. No product code changes.'
time: 2026-11-26T04:30:00.000000+00:00
