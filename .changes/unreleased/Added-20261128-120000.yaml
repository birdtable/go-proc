kind: Added
body: 'proc: `Result.End` says how the program ended, as far as its system can tell: `EndExited`, its own exit, with `Code`; `EndSignal`, an end by a signal go-proc did not send, with `Result.Signal` naming it (Linux, macOS and the other Unix systems); `EndAbnormal`, an exit code of 0xC0000000 and above, an NTSTATUS error value such as an access violation, with `Result.Status` (Windows); and `EndNone` for a run go-proc refused or ended, whose error says why, as before. On Windows a program another process ends by `TerminateProcess` with a code below 0xC0000000 reads `EndExited` with that code, and one ended with a code at or above it reads `EndAbnormal`: the system keeps no mark of who chose the code. `Code` and the error do not change.'
