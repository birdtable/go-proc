name: release

# Runs only by hand, never on a push, a tag or a pull request: the release is created by a maintainer's
# gh release create. It is kept for when no other system can run the release tier.
# Every job has a 20-minute timeout. The Go module and build caches are restored and saved by
# setup-go, keyed on go.sum and tools/*.sum, so the pinned tools are not compiled again on a hit.
# The release tier runs on Linux and on Windows, and the release is created only when both are
# green, from a run on a tag.
#
# The input ref is a commit to run the tiers at, as its
# full sha: the reviewed head of a pull request, before its tag exists. With it, fetch and both tier
# jobs check out that commit and the release job does not run, on a tag or off one: such a run
# publishes nothing. Anything but 40 lower-case hex digits is refused by fetch's first step, before
# any checkout, so the three jobs can never run three trees. The value reaches that step through
# its environment and the checkouts through their ref input, and is pasted into no script. With
# no ref the workflow is what it was: the tree is the one the run was started on.
#
# hatch is a go tool of this tree (tools/hatch.mod) and go-testkit a module its tests require, and both
# are fetched with a token, so the modules are fetched by one job and handed to the tier jobs, which hold no token:
#   - fetch holds a token of the org's read-only GitHub App, narrowed to hatch and go-testkit and to
#     Contents: read, made
#     by create-github-app-token from the repository secrets BIRDTABLE_APP_ID and BIRDTABLE_APP_KEY. The
#     token is in the one step that runs go mod download, in that step's environment and in no file. The
#     job runs no other code of the tree. It uploads the module download cache, and not the VCS cache, so
#     nothing it wrote under the token's name leaves the job.
#   - linux and windows download that cache and run with GOFLAGS=-mod=mod and GOPROXY=off, and no
#     secret, so the tree's code, its tests and its tools never see a token.
#   - The tier jobs unpack it into go's own module cache, not a folder of their own. setup-go installs
#     the go line's version, and go then fetches the toolchain line's into that cache, for the runner's
#     OS: a job that moved GOMODCACHE after it would lose that toolchain, and with GOPROXY=off could
#     not fetch it again. The fetch job's zip is Linux's alone.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: a commit to run the tiers at, as its full sha; nothing is published
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Each job has 30 minutes: the windows tier has taken 16 of its 20, and task lint there has 20m.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The tier jobs need this one, so a refusal here runs nothing. The whole value is judged, not a
      # line of it, and in the C locale, where a-f names six letters on every runner.
      - name: ref is empty or a full commit sha
        env:
          REF: ${{ inputs.ref }}
          LC_ALL: C
        run: |
          refuse() { echo "ref is not a full commit sha, so nothing runs"; exit 1; }
          case "$REF" in
            '') ;;
            *[!0-9a-f]*) refuse ;;
            *) if [ "${#REF}" -ne 40 ]; then refuse; fi ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      # app-id takes the App ID the secret holds; client-id, which replaces it, takes the Client ID.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BIRDTABLE_APP_ID }}
          private-key: ${{ secrets.BIRDTABLE_APP_KEY }}
          owner: birdtable
          repositories: hatch,go-testkit
          permission-contents: read
      # git reads its URL rewrite from the environment of this step alone: nothing is written to a git
      # config file, and go's VCS cache is not uploaded.
      # Three rewrites, each for one repository: the App token (hatch and go-testkit alone) for hatch
      # and for go-testkit, which go.mod requires for the tests, and this run's
      # own token, which reads this repository alone, for go-proc, which tools/hatch.mod requires at an
      # earlier tag and which needs the token as well. Neither token is written to a file.
      - name: download the modules, the tools' too, and what go mod tidy reads
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          OWN_TOKEN: ${{ github.token }}
          GOPRIVATE: github.com/birdtable/*
          GIT_TERMINAL_PROMPT: "0"
        run: |
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/birdtable/hatch.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/birdtable/hatch"
          export GIT_CONFIG_KEY_1="url.https://x-access-token:${OWN_TOKEN}@github.com/birdtable/go-proc.insteadOf"
          export GIT_CONFIG_VALUE_1="https://github.com/birdtable/go-proc"
          export GIT_CONFIG_KEY_2="url.https://x-access-token:${TOKEN}@github.com/birdtable/go-testkit.insteadOf"
          export GIT_CONFIG_VALUE_2="https://github.com/birdtable/go-testkit"
          go mod tidy
          go mod download
          for m in tools/*.mod; do go mod download -modfile="$m"; done
          go -C tools/gate mod download
      - id: cache
        run: echo "dir=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gomod
          path: ${{ steps.cache.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

  # The release tier on Linux.
  linux:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      # go's own module cache, which holds the toolchain setup-go's step switched to.
      - id: cache
        shell: bash
        run: echo "dir=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gomod
          path: ${{ steps.cache.outputs.dir }}
      - name: the modules come from the fetch job
        shell: bash
        run: |
          {
            echo "GOFLAGS=-mod=mod"
            echo "GOPROXY=off"
            echo "GOPRIVATE=github.com/birdtable/*"
          } >> "$GITHUB_ENV"
      # proc's tests make user and pid namespaces of their own, and mount in them (the sibling pid
      # namespace row of task test). Ubuntu's AppArmor (24.04 and later) restricts an unprivileged
      # user namespace: it is made, then refused its mounts, "permission denied". The restriction is
      # turned off for this job's runner, by the sysctl Ubuntu documents for it, so the rows run as
      # they do on any other Linux, not skipped and not moved out of the tier. A runner
      # with no such key is red here, not green without the rows' namespaces. The same sysctl lets
      # the release tier's task namespace run unshare.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # task namespace runs proc's tests under unshare and tini; tini is installed here.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tini
      - run: go tool -modfile=tools/task.mod task release

  # The same release tier on Windows, in bash, whose PATH has the tools the budget reads the
  # time with.
  windows:
    needs: fetch
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      # go's own module cache, which holds the toolchain setup-go's step switched to.
      - id: cache
        shell: bash
        run: echo "dir=$(go env GOMODCACHE)/cache/download" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gomod
          path: ${{ steps.cache.outputs.dir }}
      - name: the modules come from the fetch job
        shell: bash
        run: |
          {
            echo "GOFLAGS=-mod=mod"
            echo "GOPROXY=off"
            echo "GOPRIVATE=github.com/birdtable/*"
          } >> "$GITHUB_ENV"
      - run: go tool -modfile=tools/task.mod task release
        shell: bash

  # The only job that writes: it needs both tiers green, and a run that is not on a tag has none to
  # release, so it is skipped. A run with a ref is skipped too, wherever it was started: its tiers
  # ran the ref's tree, not the tag's. The if names each job of needs, so the workflow check (task
  # workflows) fails when one is dropped from it.
  # gh reads the notes file through any link, and its environment holds GH_TOKEN, so a notes
  # file that is a link, or is reached through a linked folder, would publish what it points at.
  # Nothing is published unless .changes/<tag>.md is a regular
  # file at that path in the tag's tree, with at least one changie item line.
  release:
    needs: [linux, windows]
    if: inputs.ref == '' && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          notes=".changes/$GITHUB_REF_NAME.md"
          refuse() { echo "$notes $1, so nothing is published"; exit 1; }
          if [ -L "$notes" ]; then refuse "is a link"; fi
          if [ ! -f "$notes" ]; then refuse "is missing or not a regular file"; fi
          if [ "$(realpath "$notes")" != "$(pwd -P)/$notes" ]; then refuse "is reached through a linked folder"; fi
          if ! grep -q '^[*-] ' "$notes"; then refuse "holds no changie item line"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
