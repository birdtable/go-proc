# Runs go vet and go test on GitHub's hosted runners, on Linux, macOS and Windows, for every pull
# request, every push to main, and by hand. It holds no secret, and its token reads the repository's
# contents alone. Every module is fetched through the public Go module proxy, as a program that
# imports go-proc fetches them, and nothing is kept in the Actions cache.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=mod
      GOPROXY: https://proxy.golang.org,direct
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Ubuntu's runners keep an unprivileged account from mapping itself in a new user namespace
      # (AppArmor's restrict_unprivileged_userns), which the Linux tests of proc that start a child in
      # a user namespace of its own need, as a stock Linux allows. This lifts that rule on the runner
      # alone; the tests still run as the runner's own account, with no root.
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
